name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Java modules
        run: mvn --batch-mode clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect generated Angular application
        id: angular
        run: |
          if [ -f frontend/operator-console/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.angular.outputs.exists == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/operator-console/package-lock.json
      - name: Install frontend dependencies
        if: steps.angular.outputs.exists == 'true'
        working-directory: frontend/operator-console
        run: npm ci
      - name: Test frontend
        if: steps.angular.outputs.exists == 'true'
        working-directory: frontend/operator-console
        run: npm test -- --watch=false
      - name: Build frontend
        if: steps.angular.outputs.exists == 'true'
        working-directory: frontend/operator-console
        run: npm run build
      - name: Frontend not generated yet
        if: steps.angular.outputs.exists != 'true'
        run: echo "Skipping frontend until the Angular workspace is generated."
