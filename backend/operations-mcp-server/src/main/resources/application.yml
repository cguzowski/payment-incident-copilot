spring:
  application:
    name: operations-mcp-server
  ai:
    mcp:
      server:
        name: operations-mcp-server
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        annotation-scanner:
          enabled: false
        capabilities:
          completion: false
          prompt: false
          resource: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
