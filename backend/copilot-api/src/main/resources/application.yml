spring:
  application:
    name: copilot-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_copilot}
    username: ${SPRING_DATASOURCE_USERNAME:payment_copilot}
    password: ${SPRING_DATASOURCE_PASSWORD:local_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
    model:
      embedding: bedrock-titan
    vectorstore:
      pgvector:
        initialize-schema: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
