spring:
  application:
    name: copilot-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_copilot}
    username: ${SPRING_DATASOURCE_USERNAME:payment_copilot}
    password: ${SPRING_DATASOURCE_PASSWORD:local_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    model:
      embedding: ${AI_MODEL_EMBEDDING:none}
    bedrock:
      aws:
        region: ${AWS_REGION:eu-central-1}
      titan:
        embedding:
          model: amazon.titan-embed-text-v2:0
    mcp:
      client:
        initialized: false
        request-timeout: ${OPERATIONS_MCP_REQUEST_TIMEOUT:5s}
        annotation-scanner:
          enabled: false
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            operations:
              url: ${OPERATIONS_MCP_BASE_URL:http://localhost:8081}
              endpoint: /mcp

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  knowledge:
    ingestion:
      enabled: false
    embedding-smoke-test:
      enabled: false
