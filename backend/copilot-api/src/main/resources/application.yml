spring:
  application:
    name: copilot-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_copilot}
    username: ${SPRING_DATASOURCE_USERNAME:payment_copilot}
    password: ${SPRING_DATASOURCE_PASSWORD:local_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    model:
      chat: ollama
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        model: qwen3.5:4b
        temperature: 0
      embedding:
        model: nomic-embed-text
    mcp:
      client:
        initialized: false
        request-timeout: ${OPERATIONS_MCP_REQUEST_TIMEOUT:5s}
        annotation-scanner:
          enabled: false
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            operations:
              url: ${OPERATIONS_MCP_BASE_URL:http://localhost:8081}
              endpoint: /mcp

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  report:
    smoke-test:
      enabled: false
  knowledge:
    ingestion:
      enabled: false
    embedding-smoke-test:
      enabled: false
