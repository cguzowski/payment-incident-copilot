spring:
  application:
    name: copilot-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_copilot}
    username: ${SPRING_DATASOURCE_USERNAME:payment_copilot}
    password: ${SPRING_DATASOURCE_PASSWORD:local_only_change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  ai:
    retry:
      max-attempts: 1
    model:
      chat: none
      embedding: ollama
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      embedding:
        model: nomic-embed-text
    mcp:
      client:
        initialized: false
        request-timeout: ${OPERATIONS_MCP_REQUEST_TIMEOUT:5s}
        annotation-scanner:
          enabled: false
        toolcallback:
          enabled: false
        streamable-http:
          connections:
            operations:
              url: ${OPERATIONS_MCP_BASE_URL:http://localhost:8081}
              endpoint: /mcp

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  report:
    generation-timeout: ${REPORT_GENERATION_TIMEOUT:2m}
    smoke-test:
      enabled: false
  knowledge:
    ingestion:
      enabled: false
    pdf-catalog:
      enabled: false
      corpus-root: ${SYNTEN_CORPUS_ROOT:}
    pdf-backfill:
      enabled: false
      per-call-timeout: ${SYNTEN_PDF_EMBEDDING_CALL_TIMEOUT:30s}
      operation-timeout: ${SYNTEN_PDF_EMBEDDING_OPERATION_TIMEOUT:8h}
    retrieval-evaluation:
      enabled: false
      cases-path: ${SYNTEN_RETRIEVAL_CASES_PATH:}
      scenario-catalog-path: ${SYNTEN_SCENARIO_CATALOG_PATH:}
      corpus-root: ${SYNTEN_CORPUS_ROOT:}
      seed-manifest-path: ${SYNTEN_RETRIEVAL_EVALUATION_SEED_MANIFEST:}
      output-directory: ${SYNTEN_RETRIEVAL_EVALUATION_RESULTS_DIR:}
    embedding-smoke-test:
      enabled: false
